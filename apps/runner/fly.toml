# Fly.io configuration for the Testea Playwright runner.
# Rename `app` before first deploy (e.g. `fly apps create testea-runner`).
#
# Build context is this directory so the runner deploys independently of the
# monorepo. Deploy from apps/runner:  fly deploy --config fly.toml
app = "testea-runner"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # 러너는 run 간 격리를 위해 한 번에 하나의 spec 만 실행한다 (server.ts 가 동시 요청을
  # 503 으로 거부). 프록시도 머신당 1건만 보내도록 맞춘다.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 1

[http_service.checks]
  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # Playwright/Chromium needs headroom; 1GB is the practical floor for stable runs.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
